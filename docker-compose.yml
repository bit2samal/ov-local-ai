services:
  model-server:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_ID: ${MODEL_ID:-OpenVINO/Qwen3.5-9B-int8-ov}
      TARGET_DEVICE: ${TARGET_DEVICE:-CPU}
    command:
      - --source_model
      - ${MODEL_ID:-OpenVINO/Qwen3.5-9B-int8-ov}
      - --task
      - text_generation
      - --model_repository_path
      - /models
      - --tool_parser
      - hermes3
      - --reasoning_parser
      - qwen3
      - --cache_size
      - "2"
      - --target_device
      - ${TARGET_DEVICE:-CPU}
      - --rest_port
      - "8000"
    volumes:
      - ./models:/models
    restart: unless-stopped
